spring:
  application:
    name: memora
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${SERVER_PORT}

jwt:
  secret: ${JWT_SECRET}
  access-ttl: ${JWT_ACCESS_TTL:900000}
  refresh-ttl: ${JWT_REFRESH_TTL:2592000000}

logging:
  level:
    root: INFO
    fcs.memora: INFO

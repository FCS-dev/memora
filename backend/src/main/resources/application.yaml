spring:
  application:
    name: memora
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

memora:
  ai:
    enabled: ${AI_ENABLED:false}
    api-key: ${GROQ_API_KEY:}
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    model: ${GROQ_CHAT_MODEL:openai/gpt-oss-20b}
    temperature: ${AI_TEMPERATURE:0.2}
    max-output-tokens: ${GROQ_MAX_OUTPUT_TOKENS:2048}
    timeout-ms: ${AI_TIMEOUT_MS:20000}
    daily-limit: ${AI_DAILY_LIMIT:50}
    max-input-code-points: ${AI_MAX_INPUT_CODE_POINTS:2500}
    notice-version: ${AI_NOTICE_VERSION:1}

server:
  port: ${SERVER_PORT}

jwt:
  secret: ${JWT_SECRET}
  access-ttl: ${JWT_ACCESS_TTL:900000}
  refresh-ttl: ${JWT_REFRESH_TTL:2592000000}

logging:
  level:
    root: INFO
    fcs.memora: INFO

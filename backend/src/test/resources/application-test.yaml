spring:
  datasource:
    url: jdbc:h2:mem:memoratest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  secret: testSecretKeyAtLeast32CharactersLongForTestingPurposesOnly
  access-ttl: 900000
  refresh-ttl: 2592000000

server:
  port: 0

memora:
  ai:
    enabled: false
